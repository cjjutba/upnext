"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install"
archive = "rm -rf node_modules"
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT --strictPort"
available_in = [ "local" ]
default = true
icon = "play"

[scripts.run.test]
command = "npm run test:watch"
icon = "test-tube"

[scripts.run.preview]
command = "npm run build && npm run preview -- --port $((CONDUCTOR_PORT + 1)) --strictPort"
available_in = [ "local" ]
icon = "package"
